schema_version: 1

context:
  version: "5.4.1"

package:
  name: mixpanel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mixpanel/mixpanel-${{ version }}.tar.gz
  sha256: 633f82d478e671732f13b939ba16b8a1689b0a605885b871f3bcf6dbaf6667ac

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - requests >=2.4.2,<3
    - httpx >=0.27.0
    - pydantic >=2.0.0,<2.12
    - asgiref >=3.0.0
    - json-logic ==0.7.0a0

tests:
  - python:
      imports:
        - mixpanel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        # https://github.com/mixpanel/mixpanel-python/issues/183
        # currently broken on 3.14
        # - "*"

about:
  summary: Official Mixpanel library for Python
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/mixpanel/mixpanel-python

extra:
  recipe-maintainers:
    - rabah-khalek
    - synapticarbors
