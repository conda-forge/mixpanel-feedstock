schema_version: 1

context:
  version: "5.5.0"

package:
  name: mixpanel
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mixpanel/mixpanel-${{ version }}.tar.gz
  sha256: e2a17f6f0db4bfc5a61429b1c718ae28ff40cee9e6fb50a0ed1e57614e615e2a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - requests >=2.4.2,<3
    - httpx >=0.27.0
    - asgiref >=3.0.0
    - json-logic ==0.7.0a0

tests:
  - python:
      imports:
        - mixpanel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Official Mixpanel library for Python
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/mixpanel/mixpanel-python

extra:
  recipe-maintainers:
    - rabah-khalek
    - synapticarbors
